<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Checker</title>
<style>
/* Layout: a column per source (Report / Freedom / TRF), one row per field, a status column that
   turns green/red/amber live as values are typed, with a summary banner above. */
:root {
  --bg: #eaf4f9;
  --surface: #ffffff;
  --surface-sunken: #d9ecf6;
  --border: #b9d9e8;
  --text: #15232a;
  --text-dim: #5b6b72;
  --accent: #0e7c86;
  --accent-soft: #e2f3f2;
  --match: #1a7d43;
  --match-bg: #e5f5e9;
  --mismatch: #b3281e;
  --mismatch-bg: #fcebe9;
  --incomplete: #9a6600;
  --incomplete-bg: #fbf1dd;
  --empty: #7c8a90;
  --empty-bg: #eef1f2;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181b;
    --surface: #182226;
    --surface-sunken: #0d1416;
    --border: #2b383d;
    --text: #e7eef0;
    --text-dim: #93a4aa;
    --accent: #4fc3c9;
    --accent-soft: #132d2d;
    --match: #5fd98a;
    --match-bg: #113322;
    --mismatch: #ff8a80;
    --mismatch-bg: #3a1613;
    --incomplete: #f2c04b;
    --incomplete-bg: #352a0c;
    --empty: #8b999e;
    --empty-bg: #1c2529;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181b;
  --surface: #182226;
  --surface-sunken: #0d1416;
  --border: #2b383d;
  --text: #e7eef0;
  --text-dim: #93a4aa;
  --accent: #4fc3c9;
  --accent-soft: #132d2d;
  --match: #5fd98a;
  --match-bg: #113322;
  --mismatch: #ff8a80;
  --mismatch-bg: #3a1613;
  --incomplete: #f2c04b;
  --incomplete-bg: #352a0c;
  --empty: #8b999e;
  --empty-bg: #1c2529;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "IBM Plex Sans", -apple-system, sans-serif;
}
.page {
  max-width: 1600px;
  margin: 0 auto;
  padding-left: max(40px, env(safe-area-inset-left, 0px));
  padding-right: max(40px, env(safe-area-inset-right, 0px));
  padding-block: 32px 56px;
}
@media (max-width: 860px) {
  .page {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
}
header.hero {
  margin-bottom: 20px;
  text-align: center;
}
header.hero .eyebrow {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 6px;
}
header.hero h1 {
  font-size: clamp(28px, 4.5vw, 42px);
  font-weight: 700;
  margin: 0 0 10px;
  text-wrap: balance;
}
header.hero p {
  margin: 0 auto;
  color: var(--text-dim);
  font-size: 16px;
  max-width: 62ch;
  line-height: 1.5;
}

/* Template picker */
.template-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(15, 35, 45, 0.12);
  padding: 12px 16px;
  margin-bottom: 22px;
}
.template-bar label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-dim);
  font-family: "IBM Plex Mono", monospace;
}
.template-bar select {
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 10px;
  cursor: pointer;
}
.template-bar select:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.template-hint {
  font-size: 12.5px;
  color: var(--text-dim);
}

/* Summary banner */
.summary {
  display: flex;
  gap: 14px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 5px solid var(--empty);
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(15, 35, 45, 0.12);
  padding: 16px 18px;
  margin-bottom: 22px;
  transition: border-color 0.15s ease;
}
.summary[hidden] { display: none; }
.summary.state-match { border-left-color: var(--match); }
.summary.state-mismatch { border-left-color: var(--mismatch); }
.summary.state-incomplete { border-left-color: var(--incomplete); }
.summary-icon { flex: none; width: 24px; height: 24px; margin-top: 1px; }
.summary-icon svg { width: 100%; height: 100%; }
.summary-headline {
  font-weight: 600;
  font-size: 15px;
  margin: 0;
}

/* Source cards */
.sources {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
.source-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(15, 35, 45, 0.12);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
.source-card-header {
  padding: 18px 20px;
  background: var(--surface-sunken);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 12px;
}
/* A distinct tint per source so Report/Freedom/TRF are told apart at a glance */
.source-card[data-source="report"] .source-card-header { background: #dcedfb; border-bottom-color: #b7d4ee; }
.source-card[data-source="freedom"] .source-card-header { background: #ddf3ea; border-bottom-color: #b6e0cd; }
.source-card[data-source="trf"] .source-card-header { background: #fbecd9; border-bottom-color: #efcea0; }
.source-card-header h2 {
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  font-family: "IBM Plex Mono", monospace;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text);
}
.upload-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--accent);
  background: var(--surface);
  border: 1px dashed var(--accent);
  border-radius: 7px;
  padding: 7px 10px;
  cursor: pointer;
  width: fit-content;
}
.upload-btn:hover { background: var(--accent-soft); }
.upload-btn svg { width: 14px; height: 14px; flex: none; }
.source-card-header input[type="file"] { display: none; }
.upload-status {
  font-size: 11.5px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 14px;
}
.upload-status.is-busy { color: var(--accent); }
.upload-status.is-error { color: var(--mismatch); }
.spinner {
  width: 10px;
  height: 10px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

.source-fields { padding: 6px 20px; flex: 1; }
.field-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 13px 8px;
  margin: 0 -8px;
  border-bottom: 1px solid var(--border);
  border-radius: 6px;
  transition: background 0.15s ease;
}
.field-row:last-child { border-bottom: none; }
.field-row.row-match { background: var(--match-bg); }
.field-row.row-mismatch { background: var(--mismatch-bg); }
.field-row.row-incomplete { background: var(--incomplete-bg); }
.field-row .dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-top: 6px;
  flex: none;
  background: var(--empty);
}
.dot-match { background: var(--match); }
.dot-mismatch { background: var(--mismatch); }
.dot-incomplete { background: var(--incomplete); }
.dot-empty { background: var(--empty); }
.field-body { flex: 1; min-width: 0; }
.field-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text);
  font-family: "IBM Plex Mono", monospace;
}
.field-value {
  display: block;
  width: 100%;
  margin-top: 3px;
  padding: 2px 0;
  border: none;
  border-bottom: 1px solid transparent;
  background: transparent;
  color: var(--text);
  font-size: 14.5px;
  font-family: inherit;
}
.field-value:hover, .field-value:focus {
  border-bottom-color: var(--border);
  outline: none;
}
.field-value::placeholder { color: var(--text-dim); opacity: 0.55; }

.source-card-footer { padding: 2px 20px 16px; }
.ocr-details { font-size: 11.5px; }
.ocr-details summary { cursor: pointer; color: var(--text-dim); user-select: none; }
.ocr-text {
  white-space: pre-wrap;
  background: var(--surface-sunken);
  border-radius: 6px;
  padding: 8px;
  margin: 6px 0 0;
  max-height: 160px;
  overflow: auto;
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  color: var(--text);
}

.actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 16px;
}
#clearBtn, #exportExcelBtn, #exportPdfBtn {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  background: var(--surface);
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 9px 14px;
  cursor: pointer;
}
#clearBtn:hover { color: var(--mismatch); border-color: var(--mismatch); }
#exportExcelBtn, #exportPdfBtn { color: var(--accent); border-color: var(--accent); }
#exportExcelBtn:hover, #exportPdfBtn:hover { background: var(--accent-soft); }

@media (max-width: 860px) {
  .sources { grid-template-columns: 1fr; }
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>

<div class="page">
  <header class="hero">
    <h1>Report Checker</h1>
    <p>Upload or type the patient details from the Report, Freedom, and TRF — any mismatch is flagged instantly.</p>
  </header>

  <div class="template-bar">
    <label for="templateSelect">Choose template</label>
    <select id="templateSelect">
      <option value="common">General (common fields only)</option>
      <option value="pgta">PGT-A</option>
      <option value="qfpcr">QF-PCR</option>
      <option value="ycmd">YCMD</option>
      <option value="karyotyping">Karyotyping</option>
      <option value="nipt">NIPT</option>
    </select>
    <span class="template-hint" id="templateHint"></span>
  </div>

  <section id="summary" class="summary state-empty" aria-live="polite" hidden>
    <span class="summary-icon" id="summaryIcon"></span>
    <p class="summary-headline" id="summaryHeadline"></p>
  </section>

  <section class="sources" id="sourcesWrap"></section>

  <div class="actions">
    <button id="exportExcelBtn" type="button">Download as Excel</button>
    <button id="exportPdfBtn" type="button">Download as PDF</button>
    <button id="clearBtn" type="button">Clear all fields</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/5.0.9/jspdf.plugin.autotable.min.js"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
</script>
<script>
(function () {
  "use strict";

  function pad(n) { n = String(n); return n.length < 2 ? "0" + n : n; }
  function monthIndex(str) {
    var months = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
    var idx = months.indexOf(str.slice(0, 3).toLowerCase());
    return idx >= 0 ? String(idx + 1) : null;
  }

  function normalizeText(str) {
    return str.trim().toLowerCase().replace(/\s+/g, " ");
  }
  function normalizeAge(str) {
    var s = str.trim().toLowerCase();
    if (!s) return "";
    var m = s.match(/\d+/);
    return m ? m[0] : s;
  }
  function normalizeGender(str) {
    var s = str.trim().toLowerCase();
    if (!s) return "";
    if (s[0] === "m") return "male";
    if (s[0] === "f") return "female";
    return s;
  }
  function normalizeDoctor(str) {
    return str.trim().toLowerCase().replace(/^dr\.?\s*/, "").replace(/\s+/g, " ");
  }
  function normalizeId(str) {
    return str.trim().toLowerCase().replace(/[\s-]+/g, "");
  }
  function normalizeIdList(str) {
    return str.split(",")
      .map(function (s) { return s.trim().toLowerCase().replace(/\s+/g, ""); })
      .filter(Boolean)
      .sort()
      .join(",");
  }
  function normalizeDate(str) {
    var s = str.trim();
    if (!s) return "";
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return m[1] + "-" + pad(m[2]) + "-" + pad(m[3]);

    m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (m) {
      var d1 = m[1], mo1 = m[2], y1 = m[3];
      if (y1.length === 2) y1 = (parseInt(y1, 10) > 50 ? "19" : "20") + y1;
      return y1 + "-" + pad(mo1) + "-" + pad(d1);
    }

    m = s.match(/^(\d{1,2})[\s\-]+([A-Za-z]{3,9})[\s\-,]+(\d{2,4})$/);
    if (m) {
      var mo2 = monthIndex(m[2]);
      if (mo2) {
        var y2 = m[3];
        if (y2.length === 2) y2 = (parseInt(y2, 10) > 50 ? "19" : "20") + y2;
        return y2 + "-" + pad(mo2) + "-" + pad(m[1]);
      }
    }

    m = s.match(/^([A-Za-z]{3,9})[\s\-,]+(\d{1,2}),?[\s\-,]+(\d{2,4})$/);
    if (m) {
      var mo3 = monthIndex(m[1]);
      if (mo3) {
        var y3 = m[3];
        if (y3.length === 2) y3 = (parseInt(y3, 10) > 50 ? "19" : "20") + y3;
        return y3 + "-" + pad(mo3) + "-" + pad(m[2]);
      }
    }

    return s.toLowerCase().replace(/\s+/g, " ");
  }

  var SOURCES = [
    { key: "report", label: "Report" },
    { key: "freedom", label: "Freedom screenshot" },
    { key: "trf", label: "TRF" }
  ];

  var COMMON_FIELDS = [
    { key: "name", label: "Patient Name", placeholder: "e.g. Rajesh Kumar", normalize: normalizeText, fuzzyPrefix: true },
    { key: "age", label: "Age", placeholder: "e.g. 34", normalize: normalizeAge },
    { key: "gender", label: "Gender", placeholder: "e.g. Male", normalize: normalizeGender },
    { key: "uhid", label: "Patient ID / UHID", placeholder: "e.g. AD-00123456", normalize: normalizeId },
    { key: "doctor", label: "Referring Doctor", placeholder: "e.g. Dr. S. Mehta", normalize: normalizeDoctor },
    { key: "hospital", label: "Hospital / Clinic", placeholder: "e.g. City Hospital", normalize: normalizeText, fuzzyPrefix: true },
    { key: "sampleId", label: "Sample / Barcode No.", placeholder: "e.g. 7741098", normalize: normalizeId },
    { key: "collectionDate", label: "Collection Date", placeholder: "e.g. 21/10/2026", normalize: normalizeDate }
  ];

  // Extra fields layered on top of COMMON_FIELDS for a given test template.
  // Populated one template at a time — only PGT-A so far.
  var TEMPLATE_EXTRA_FIELDS = {
    common: [],
    pgta: [
      { key: "partnerName", label: "Partner's Name", placeholder: "e.g. Mr. Suresh Kumar", normalize: normalizeText },
      { key: "specimenType", label: "Specimen Type", placeholder: "e.g. Day 5 Trophectoderm Biopsy", normalize: normalizeText },
      { key: "biopsyDate", label: "Biopsy Date", placeholder: "e.g. 27-08-2026", normalize: normalizeDate },
      { key: "receiptDate", label: "Sample Receipt Date", placeholder: "e.g. 01-09-2026", normalize: normalizeDate },
      { key: "biopsyBy", label: "Biopsy Performed By", placeholder: "e.g. Vidyashree K. Teji", normalize: normalizeText },
      { key: "embryoIds", label: "Embryo ID(s)", placeholder: "e.g. PS1, PS2, PS3", normalize: normalizeIdList }
    ],
    qfpcr: [
      { key: "partnerName", label: "Partner's Name", placeholder: "e.g. Mr. Suresh Kumar", normalize: normalizeText, fuzzyPrefix: true },
      { key: "specimenType", label: "Specimen Type", placeholder: "e.g. Amniotic Fluid", normalize: normalizeText },
      { key: "gestationalAge", label: "Gestational Age", placeholder: "e.g. 23 Weeks / 1 Day", normalize: normalizeText },
      { key: "pregnancyType", label: "Pregnancy Type", placeholder: "e.g. Natural Pregnancy", normalize: normalizeText },
      { key: "receiptDate", label: "Sample Receipt Date", placeholder: "e.g. 14-10-2026", normalize: normalizeDate }
    ],
    ycmd: [
      { key: "specimenType", label: "Specimen Type", placeholder: "e.g. Peripheral Blood", normalize: normalizeText },
      { key: "receiptDate", label: "Sample Receipt Date", placeholder: "e.g. 21-10-2026", normalize: normalizeDate }
    ],
    karyotyping: [],
    nipt: []
  };

  var TEMPLATE_HINTS = {
    common: "Checks the 7 common patient/sample fields only.",
    pgta: "Adds partner's name, specimen type, biopsy date, sample receipt date, biopsy performer and embryo ID(s).",
    qfpcr: "Adds partner's name, specimen type, gestational age, pregnancy type and sample receipt date.",
    ycmd: "Adds specimen type and sample receipt date.",
    karyotyping: "No extra fields added yet — common fields only for now.",
    nipt: "No extra fields added yet — common fields only for now."
  };

  var FIELDS = COMMON_FIELDS.slice();

  var ICONS = {
    match: '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5 6.3 12 13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    mismatch: '<svg viewBox="0 0 16 16" fill="none"><path d="M8 1.5 15 14H1L8 1.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6.2V9.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.6" r="0.9" fill="currentColor"/></svg>',
    incomplete: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.3" stroke="currentColor" stroke-width="1.6"/><path d="M8 5v3.3l2.2 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    empty: '<svg viewBox="0 0 16 16" fill="none"><path d="M4 8h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
  };

  var UPLOAD_ICON = '<svg viewBox="0 0 16 16" fill="none"><path d="M8 11V3M8 3 5 6M8 3l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11v1.5A1.5 1.5 0 0 0 4.5 14h7A1.5 1.5 0 0 0 13 12.5V11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var sourcesWrap = document.getElementById("sourcesWrap");

  function buildSourceCards() {
    sourcesWrap.innerHTML = "";
    SOURCES.forEach(function (src) {
      var card = document.createElement("div");
      card.className = "source-card";
      card.setAttribute("data-source", src.key);

      var headerHtml =
        '<div class="source-card-header">' +
        "<h2>" + src.label + "</h2>" +
        '<label class="upload-btn" for="file-' + src.key + '">' + UPLOAD_ICON + "<span>Upload image or PDF</span></label>" +
        '<input type="file" id="file-' + src.key + '" accept="image/*,application/pdf">' +
        '<div class="upload-status" id="status-' + src.key + '"></div>' +
        "</div>";

      var fieldsHtml = '<div class="source-fields">';
      FIELDS.forEach(function (field) {
        fieldsHtml +=
          '<div class="field-row" id="' + field.key + "-row-" + src.key + '">' +
          '<span class="dot" id="' + field.key + "-dot-" + src.key + '"></span>' +
          '<div class="field-body">' +
          '<div class="field-label">' + field.label + "</div>" +
          '<input class="field-value" type="text" id="' + field.key + "-" + src.key + '" ' +
          'data-field="' + field.key + '" data-source="' + src.key + '" ' +
          'placeholder="' + field.placeholder + '" autocomplete="off">' +
          "</div>" +
          "</div>";
      });
      fieldsHtml += "</div>";

      var footerHtml =
        '<div class="source-card-footer">' +
        '<details class="ocr-details" id="details-' + src.key + '" hidden>' +
        "<summary>View extracted text</summary>" +
        '<pre class="ocr-text" id="ocrtext-' + src.key + '"></pre>' +
        "</details>" +
        "</div>";

      card.innerHTML = headerHtml + fieldsHtml + footerHtml;
      sourcesWrap.appendChild(card);
    });
  }

  function setFieldStatusUI(result) {
    var field = result.field;
    SOURCES.forEach(function (src) {
      var cls = "empty";
      if (result.status === "match") {
        cls = "match";
      } else if (result.status === "mismatch") {
        cls = result.differing.indexOf(src.label) !== -1 ? "mismatch" : "match";
      } else if (result.status === "incomplete") {
        if (result.missing.indexOf(src.label) !== -1) {
          cls = "mismatch";
        } else {
          // Present in 2 of 3 sources: green if those two agree with each
          // other, red if even the two we have already disagree.
          cls = result.filledAgree ? "match" : "mismatch";
        }
      }
      document.getElementById(field.key + "-dot-" + src.key).className = "dot dot-" + cls;
      document.getElementById(field.key + "-row-" + src.key).className = "field-row row-" + cls;
    });
  }

  // Exact equality by default. Fields with fuzzyPrefix (currently just
  // name) also accept one value being a truncated prefix of the other —
  // OCR on a wrapped table cell can cut a name short ("MRS.PAVITHRA" instead
  // of "MRS.PAVITHRA PAULRAJ"), and that's an OCR artifact, not a real
  // identity mismatch. Min length 6 keeps this from matching on a trivial
  // shared prefix like a title alone.
  function valuesCompatible(field, a, b) {
    if (a === b) return true;
    if (!field.fuzzyPrefix) return false;
    var sa = a.replace(/[^a-z0-9]/g, "");
    var sb = b.replace(/[^a-z0-9]/g, "");
    if (!sa || !sb) return false;
    var shorter = sa.length <= sb.length ? sa : sb;
    var longer = sa.length <= sb.length ? sb : sa;
    return shorter.length >= 6 && longer.indexOf(shorter) === 0;
  }

  function groupCompatibleValues(field, values) {
    var groups = [];
    values.forEach(function (v, i) {
      var g = groups.filter(function (grp) { return valuesCompatible(field, grp.rep, v); })[0];
      if (g) {
        g.indices.push(i);
        if (v.length > g.rep.length) g.rep = v;
      } else {
        groups.push({ rep: v, indices: [i] });
      }
    });
    return groups;
  }

  function evaluateField(field) {
    var raw = {};
    SOURCES.forEach(function (src) {
      raw[src.key] = document.getElementById(field.key + "-" + src.key).value;
    });
    var filledSources = SOURCES.filter(function (src) { return raw[src.key].trim() !== ""; });

    // Need at least two sources before flagging anything — one value alone
    // has nothing to compare against yet, so there's nothing to report.
    if (filledSources.length <= 1) {
      return { field: field, status: "empty", raw: raw };
    }
    var normalized = {};
    SOURCES.forEach(function (src) { normalized[src.key] = field.normalize(raw[src.key]); });

    if (filledSources.length < 3) {
      var missing = SOURCES.filter(function (src) { return raw[src.key].trim() === ""; }).map(function (s) { return s.label; });
      var filledValues = filledSources.map(function (src) { return normalized[src.key]; });
      var filledAgree = valuesCompatible(field, filledValues[0], filledValues[1]);
      return { field: field, status: "incomplete", raw: raw, missing: missing, filledAgree: filledAgree };
    }

    var values = SOURCES.map(function (src) { return normalized[src.key]; });
    var groups = groupCompatibleValues(field, values);

    if (groups.length === 1) {
      return { field: field, status: "match", raw: raw };
    }

    // the largest group is "the majority"; everyone else is flagged
    var maxCount = Math.max.apply(null, groups.map(function (g) { return g.indices.length; }));
    var majority = groups.filter(function (g) { return g.indices.length === maxCount; })[0];
    var differing = SOURCES.filter(function (src, i) { return majority.indices.indexOf(i) === -1; });
    if (differing.length === 0) differing = SOURCES.slice();

    return { field: field, status: "mismatch", raw: raw, differing: differing.map(function (s) { return s.label; }) };
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function updateAll() {
    var results = FIELDS.map(evaluateField);
    results.forEach(setFieldStatusUI);

    var mismatches = results.filter(function (r) { return r.status === "mismatch"; });
    var incompletes = results.filter(function (r) { return r.status === "incomplete"; });
    var touched = results.filter(function (r) { return r.status !== "empty"; });

    var summary = document.getElementById("summary");
    var icon = document.getElementById("summaryIcon");
    var headline = document.getElementById("summaryHeadline");

    if (touched.length === 0) {
      summary.hidden = true;
      return;
    }
    summary.hidden = false;
    summary.className = "summary";

    if (mismatches.length > 0) {
      summary.classList.add("state-mismatch");
      icon.innerHTML = ICONS.mismatch;
      headline.textContent = "Not a match — check the red field(s) below";
      return;
    }

    if (incompletes.length > 0) {
      summary.classList.add("state-incomplete");
      icon.innerHTML = ICONS.incomplete;
      headline.textContent = "Not a match yet — still waiting on some sources";
      return;
    }

    summary.classList.add("state-match");
    icon.innerHTML = ICONS.match;
    headline.textContent = "Match — all fields agree across Report, Freedom and TRF";
  }

  sourcesWrap.addEventListener("input", function (e) {
    if (e.target && e.target.classList && e.target.classList.contains("field-value")) updateAll();
  });

  document.getElementById("clearBtn").addEventListener("click", function () {
    var inputs = sourcesWrap.querySelectorAll("input.field-value");
    inputs.forEach(function (inp) { inp.value = ""; });
    SOURCES.forEach(function (src) {
      var statusEl = document.getElementById("status-" + src.key);
      var detailsEl = document.getElementById("details-" + src.key);
      var fileInput = document.getElementById("file-" + src.key);
      statusEl.className = "upload-status";
      statusEl.innerHTML = "";
      detailsEl.hidden = true;
      fileInput.value = "";
    });
    updateAll();
    inputs[0].focus();
  });

  // ---- Export (Excel / PDF) ----
  var STATUS_LABELS = { match: "Match", mismatch: "Mismatch", incomplete: "Incomplete", empty: "No data" };
  // PDF fill: [R,G,B] 0-255 subtle palette
  var STATUS_PDF_FILL = {
    Match:      [215, 239, 217],  // subtle green
    Mismatch:   [253, 222, 221],  // subtle red
    Incomplete: [255, 249, 196],  // subtle yellow
    "No data":  [255, 249, 196]   // subtle yellow
  };
  var FIELD_PDF_FILL  = [245, 240, 228]; // beige for field label column
  // Excel hex fills (6-char, no #)
  var STATUS_XL_FILL = {
    Match:      "D7EFD9",
    Mismatch:   "FDDEDD",
    Incomplete: "FFF9C4",
    "No data":  "FFF9C4"
  };

  function buildExportRows() {
    return FIELDS.map(function (field) {
      var result = evaluateField(field);
      return {
        label: field.label,
        report: result.raw.report,
        freedom: result.raw.freedom,
        trf: result.raw.trf,
        status: STATUS_LABELS[result.status]
      };
    });
  }

  function exportFileNameStamp() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function currentTemplateLabel() {
    var opt = templateSelect.options[templateSelect.selectedIndex];
    return opt ? opt.text : "Report Checker";
  }

  document.getElementById("exportExcelBtn").addEventListener("click", function () {
    if (!window.XLSX) return;
    var rows = buildExportRows();
    var COLS = ["A", "B", "C", "D", "E"];
    var header = ["Field", "Report", "Freedom Screenshot", "TRF", "Status"];
    var data = [header];
    rows.forEach(function (r) { data.push([r.label, r.report, r.freedom, r.trf, r.status]); });
    var ws = XLSX.utils.aoa_to_sheet(data);
    ws["!cols"] = [{ wch: 24 }, { wch: 30 }, { wch: 30 }, { wch: 30 }, { wch: 14 }];
    ws["!ref"] = "A1:E" + data.length;

    function xlCell(rgb, bold, whiteText) {
      return {
        fill: { patternType: "solid", fgColor: { rgb: rgb } },
        font: { bold: !!bold, color: { rgb: whiteText ? "FFFFFF" : "222222" } },
        alignment: { wrapText: true, vertical: "center" }
      };
    }

    // Header row
    COLS.forEach(function (col) {
      var addr = col + "1";
      if (!ws[addr]) ws[addr] = { t: "s", v: header[COLS.indexOf(col)] };
      ws[addr].s = xlCell("0E7C86", true, true);
      ws[addr].s.alignment.horizontal = "center";
    });

    // Data rows
    rows.forEach(function (r, ri) {
      var rowNum = ri + 2;
      var dataFill = STATUS_XL_FILL[r.status] || "FFFFFF";
      var vals = [r.label, r.report, r.freedom, r.trf, r.status];
      COLS.forEach(function (col, ci) {
        var addr = col + rowNum;
        if (!ws[addr]) ws[addr] = { t: "s", v: vals[ci] || "" };
        var isFieldCol = ci === 0;
        ws[addr].s = xlCell(isFieldCol ? "F5F0E4" : dataFill, isFieldCol, false);
      });
    });

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Comparison");
    XLSX.writeFile(wb, "report-checker-" + currentTemplateKey + "-" + exportFileNameStamp() + ".xlsx");
  });

  document.getElementById("exportPdfBtn").addEventListener("click", function () {
    if (!window.jspdf) return;
    var rows = buildExportRows();
    var doc = new jspdf.jsPDF({ orientation: "landscape" });
    doc.setFontSize(14);
    doc.text("Report Checker — " + currentTemplateLabel(), 14, 16);
    doc.setFontSize(9);
    doc.setTextColor(110);
    doc.text("Generated " + new Date().toLocaleString(), 14, 22);
    doc.autoTable({
      startY: 27,
      head: [["Field", "Report", "Freedom Screenshot", "TRF", "Status"]],
      body: rows.map(function (r) { return [r.label, r.report, r.freedom, r.trf, r.status]; }),
      styles: { fontSize: 8, cellPadding: 3, overflow: "linebreak" },
      headStyles: { fillColor: [14, 124, 134] },
      columnStyles: { 0: { fontStyle: "bold", cellWidth: 36 } },
      didParseCell: function (hook) {
        if (hook.section !== "body") return;
        if (hook.column.index === 0) {
          hook.cell.styles.fillColor = FIELD_PDF_FILL;
        } else {
          var rowStatus = rows[hook.row.index] && rows[hook.row.index].status;
          var fill = STATUS_PDF_FILL[rowStatus];
          if (fill) hook.cell.styles.fillColor = fill;
        }
      }
    });
    doc.save("report-checker-" + currentTemplateKey + "-" + exportFileNameStamp() + ".pdf");
  });

  // ---- OCR (Tesseract.js, on-device, no API key) ----
  // This path now only runs for sources with no real PDF text layer to pull
  // from instead (see extractPdfTextLayer below): images, and scanned/
  // handwritten PDFs. Tesseract needs these fed in much larger and
  // higher-contrast than they're usually captured at, or whole rows come
  // back as garbage, especially on dense UI screenshots (small table text,
  // icon-heavy rows). These two helpers do that: upscale well past the
  // source resolution, then push pixels toward black/white so thin small
  // text has more edge contrast to grab onto.
  // Hard black/white threshold beats a linear contrast stretch here — tested
  // directly against multiple LIS screenshots (teal/navy theme) and scanned
  // TRF photos via Playwright/Chromium ground-truth runs. 115 maximises total
  // correct field extraction across all file types: lower values crush text
  // on bright-background screenshots; higher values (e.g. 130) break
  // sample-ID extraction on handwritten TRF photos and produce garbage OCR
  // values that slip through plausibility checks.
  function enhanceCanvasForOcr(canvas) {
    var ctx = canvas.getContext("2d");
    var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var d = imgData.data;
    for (var i = 0; i < d.length; i += 4) {
      var gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      var v = gray < 115 ? 0 : 255;
      d[i] = v;
      d[i + 1] = v;
      d[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
    return canvas;
  }

  function loadImageElement(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () { resolve({ img: img, url: url }); };
      img.onerror = function (e) { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  function upscaleImageToCanvas(img) {
    // Scaling by width alone badly under-scales a wide-but-short table
    // screenshot (e.g. 1855x312) — the width is already "big enough" so
    // barely any upscale happens, but the actual text/row height stays
    // tiny. Text legibility tracks height, not overall width, so take
    // whichever target needs the bigger scale.
    var targetWidth = 1800;
    var targetHeight = 1400;
    var scale = Math.max(targetWidth / img.naturalWidth, targetHeight / img.naturalHeight, 1);
    scale = Math.min(scale, 6);
    var canvas = document.createElement("canvas");
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    var ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas;
  }

  function preprocessImageForOcr(file) {
    return loadImageElement(file).then(function (loaded) {
      var canvas = upscaleImageToCanvas(loaded.img);
      URL.revokeObjectURL(loaded.url);
      return enhanceCanvasForOcr(canvas);
    });
  }

  function renderPdfFirstPageToCanvas(pdf) {
    return pdf.getPage(1).then(function (page) {
      var viewport = page.getViewport({ scale: 3 });
      var canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      var ctx = canvas.getContext("2d");
      return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function () {
        return enhanceCanvasForOcr(canvas);
      });
    });
  }

  // Rebuilds a reading-order, layout-ish text block from pdf.js's raw
  // positioned glyph runs — the same idea as poppler's `pdftotext -layout`.
  // Runs are grouped into lines by y-coordinate, then joined left-to-right
  // with a run of spaces sized to the x-gap between them, so two side-by-side
  // "label : value" columns stay recognisable as two columns on one line
  // instead of colliding into one run of text.
  function reconstructLayoutText(items) {
    var rows = items.map(function (item) {
      var tx = item.transform;
      return { str: item.str, x: tx[4], y: tx[5], width: item.width || 0, height: Math.abs(tx[3]) || 10 };
    }).filter(function (it) { return it.str !== ""; });
    if (!rows.length) return "";

    // PDF y grows upward, so the top-of-page line comes first when sorted
    // descending; within a line, left-to-right by x.
    rows.sort(function (a, b) { return b.y - a.y || a.x - b.x; });

    var lines = [];
    var LINE_TOL = 2.5;
    rows.forEach(function (it) {
      var line = lines[lines.length - 1];
      if (line && Math.abs(line.y - it.y) <= LINE_TOL) {
        line.items.push(it);
        line.y = (line.y + it.y) / 2;
      } else {
        lines.push({ y: it.y, items: [it] });
      }
    });

    return lines.map(function (line) {
      line.items.sort(function (a, b) { return a.x - b.x; });
      var text = "";
      var prevEnd = null;
      line.items.forEach(function (it) {
        if (prevEnd !== null) {
          var gap = it.x - prevEnd;
          // A run's own width / string length is a bad per-glyph estimate
          // (a run can be a single "."  or a 20-char phrase, so this swings
          // wildly run to run); line height is the stable unit instead. This
          // is only shaping the human-readable text dump — field parsing
          // below never relies on *how many* spaces separate two runs.
          var charUnit = Math.max(it.height, 6);
          var spaces = gap <= charUnit ? 1 : Math.min(Math.round(gap / (charUnit * 0.5)), 20);
          text += new Array(spaces + 1).join(" ");
        }
        text += it.str;
        prevEnd = it.x + it.width;
      });
      return text;
    }).join("\n");
  }

  // Most "Report" PDFs here are born-digital (generated straight from the
  // LIS), not scanned — they already carry a real, perfectly-accurate text
  // layer, so asking Tesseract to re-read a rasterized image of them only
  // introduces OCR noise where none has to exist (confirmed directly: the
  // same PDFs that render fine here come back from `pdftotext` with full,
  // clean label:value text). Scanned/handwritten forms (the TRFs) have no
  // such layer — `getTextContent()` on those returns next to nothing — so
  // this falls back to the original rasterize-and-OCR path whenever the
  // extracted layer looks too sparse to be real content.
  var MIN_TEXT_LAYER_CHARS = 80;
  function extractPdfTextLayer(pdf) {
    return pdf.getPage(1).then(function (page) {
      return page.getTextContent();
    }).then(function (content) {
      return reconstructLayoutText(content.items);
    });
  }

  function runTesseract(input) {
    return Tesseract.recognize(input, "eng").then(function (result) { return result.data.text || ""; });
  }

  function ocrFile(file) {
    if (file.type !== "application/pdf") {
      return preprocessImageForOcr(file).then(runTesseract);
    }
    return file.arrayBuffer().then(function (buf) {
      return pdfjsLib.getDocument({ data: buf }).promise;
    }).then(function (pdf) {
      return extractPdfTextLayer(pdf).then(function (text) {
        var meaningfulChars = (text.match(/[A-Za-z0-9]/g) || []).length;
        if (meaningfulChars >= MIN_TEXT_LAYER_CHARS) return text;
        return renderPdfFirstPageToCanvas(pdf).then(runTesseract);
      });
    });
  }

  function cleanLine(s) {
    return (s || "").replace(/[|_]+/g, " ").replace(/\s{2,}/g, " ").trim();
  }

  function firstMatch(text, patterns) {
    for (var i = 0; i < patterns.length; i++) {
      var m = text.match(patterns[i]);
      if (m && m[1]) return m[1].trim();
    }
    return "";
  }

  // Like firstMatch, but scans every occurrence of each pattern (not just the
  // first in the whole text) and skips any capture the validator rejects.
  // Needed because a label can appear more than once before the real value —
  // e.g. a screenshot's search-bar hint text ("...Mobile No. OR UHID No. OR
  // Biopsy No...") can match before the actual table row with the real ID.
  function firstValidMatch(text, patterns, validator) {
    for (var i = 0; i < patterns.length; i++) {
      var p = patterns[i];
      var re = new RegExp(p.source, p.flags.indexOf("g") === -1 ? p.flags + "g" : p.flags);
      var m;
      while ((m = re.exec(text)) !== null) {
        if (m[1]) {
          var candidate = m[1].trim();
          if (!validator || validator(candidate)) return candidate;
        }
        if (m.index === re.lastIndex) re.lastIndex++;
      }
    }
    return "";
  }

  // Real IDs/sample numbers run long. This rejects a stray single digit
  // that OCR sometimes inserts right after a label — e.g. a misread colon
  // ("SAMPLE NUMBER 1 261141361" instead of "SAMPLE NUMBER : 261141361")
  // — so the match keeps scanning instead of grabbing that "1" as the value.
  function isPlausibleId(s) { return s.replace(/\D/g, "").length >= 5; }

  // Rejects a capture that is actually another column header rather than real
  // data — happens when a table's headers sit on one line with no value
  // adjacent to them (e.g. "...Patient Name Patient Mobile Age/Sex...").
  var HEADER_JUNK = ["patient mobile", "age/sex", "sex", "gender", "doctor mobile",
    "centre", "rate type", "department", "investigation", "source", "remarks",
    "pro", "lab no", "sin no", "entry datetime", "s.no", "mobile", "age",
    "doctor", "date", "no", "or", "id", "name", "type", "collection"];
  function looksLikeRealValue(v) {
    var norm = v.toLowerCase().replace(/[.\s]+$/, "").trim();
    return norm.length > 0 && HEADER_JUNK.indexOf(norm) === -1;
  }

  // Catches OCR noise standing in for a handwritten field (common on the TRF,
  // which is filled in by hand rather than printed) — a label matched fine,
  // but what follows is symbol soup, not a plausible name/doctor/hospital.
  // Requires mostly letters, no telltale OCR-garbage punctuation, and at
  // least one vowel (real words have one; dense noise usually doesn't).
  function looksLikePlausibleText(v) {
    var s = (v || "").trim();
    if (!s) return false;
    if (/[{}\[\]~^|<>@]/.test(s)) return false;
    var nonSpace = s.replace(/\s+/g, "");
    if (!nonSpace) return false;
    var letters = (nonSpace.match(/[A-Za-z]/g) || []).length;
    if (letters / nonSpace.length < 0.6) return false;
    if (!/[aeiouAEIOU]/.test(s)) return false;
    return true;
  }
  function looksLikeRealName(v) { return looksLikeRealValue(v) && looksLikePlausibleText(v); }

  // Strips a trailing OCR/table artifact left dangling on an otherwise-good
  // capture: a bare trailing dash ("RHEA HEALTHCARE PVT LTD -") from a label
  // column that ran on, or a closing bracket/quote with no matching opener
  // (a misread letter, e.g. "PAULRA)" for "PAULRAJ"). Left in place these
  // read as OCR errors even though the rest of the value is good.
  function stripTrailingJunk(v) {
    var s = (v || "").replace(/[\s\-]+$/, "");
    var closers = { ")": "(", "]": "[", "}": "{" };
    var guard = 0;
    while (s && closers[s[s.length - 1]] && guard++ < 5) {
      if (s.indexOf(closers[s[s.length - 1]]) !== -1) break;
      s = s.slice(0, -1).replace(/[\s\-]+$/, "");
    }
    return s;
  }

  function findFallbackNumericId(text) {
    var re = /\b\d{8,12}\b/g;
    var m;
    while ((m = re.exec(text)) !== null) {
      var before = text.slice(Math.max(0, m.index - 20), m.index).toLowerCase();
      if (before.indexOf("mobile") !== -1 || before.indexOf("contact") !== -1 || before.indexOf("phone") !== -1) continue;
      return m[0];
    }
    return "";
  }

  // Anderson's own PIN format (e.g. ADK0000006221) appears on report headers
  // and TRF barcodes without always having a "PIN:"/"UHID:" label next to it.
  function findLabPin(text) {
    // Anderson's PIN format varies by department (ADK for genetics, ACO for
    // andrology/embryology, etc.) — a 2-4 letter prefix plus a long number.
    // Case-insensitive and tolerant of a stray space/punctuation in between,
    // since this often gets typed into a search box rather than printed as
    // a clean label:value pair.
    var m = text.match(/\b[A-Z]{2,4}[\s.:\-]{0,2}0*\d{6,12}\b/i);
    return m ? m[0].replace(/[\s.:\-]+/g, "").toUpperCase() : "";
  }

  // A barcode/print timestamp like "16-Sep-26 12:43:57" (has seconds) is
  // distinct enough from a DOB (which never has a time) to use as a safe
  // fallback for collection date on forms with no "Collection Date:" label.
  function findPrintedTimestamp(text) {
    var m = text.match(/\b(\d{1,2}[-\/][A-Za-z]{3,9}[-\/]\d{2,4}\s+\d{1,2}:\d{2}:\d{2})\b/);
    return m ? m[1] : "";
  }

  // Catches an LIS table value cell that repeats itself twice in a row
  // (seen in Freedom, where the Doctor column literally duplicates the
  // Centre's hospital name) — a reasonable best-guess when no clean
  // "Doctor:" label exists to anchor on.
  function findDuplicatedPhrase(text) {
    var m = text.match(/\b([A-Z][A-Z&.\-]{2,}(?:\s+[A-Z][A-Z&.\-]{1,}){1,5})\s+\1\b/);
    return m ? m[1].trim() : "";
  }

  // Freedom's "Rate Type" column renders as "<billing code># <hospital
  // name>" — the referring hospital for that cell, not Anderson's own
  // processing-lab "Centre" column. The "#" itself OCRs inconsistently at
  // this cell's small size — seen coming back as "z", "%#", or a stray
  // extra digit in different runs of the very same image — so instead of
  // anchoring on it directly, this just skips whatever non-space junk sits
  // between the digits and the capital letter that starts the hospital name.
  function findRateTypeHospital(text) {
    // \b...\b pins the billing code to exactly 3-7 digits with non-digits on
    // both sides, so this can't latch onto a slice of one of the much longer
    // sample/lab ID numbers elsewhere on the same row; the junk class
    // between it and the name excludes digits too, for the same reason.
    var m = text.match(/\b\d{3,7}\b[^\s\dA-Z]{0,2}\s*([A-Z][A-Za-z0-9.,'\s-]{3,45}?)(?=\n|$|\s{2,}\S|\s+(?:DR\.?|DOCTOR|REPRODUCTIVE|GENOMICS|DEPARTMENT)\b)/);
    return m ? m[1].trim() : "";
  }

  // Freedom's Sample Tracker renders one data row as
  // "<entry datetime> <lab no> <sin no> <patient name> <mobile> <age/sex> ..."
  // Positional parsing recovers fields a label-based regex can't, since the
  // column header and its value aren't adjacent in the OCR'd text.
  // Age/sex ("40 Y 7 M 5 D /Female") is searched over the whole text on its
  // own, independent of the date/ID chain below — tying it to that chain
  // meant one failed match (e.g. a misread timestamp) silently blocked age
  // and gender too, even though they had nothing to do with each other.
  function findAgeSex(text) {
    // Looked for age and gender stuck together before, but a wrapped table
    // cell can push them apart onto what Tesseract treats as separate lines
    // with unrelated text in between — so each is now found independently.
    // Tolerate a stray inserted character between the M and the day digits
    // (seen in practice: "40Y7MS5D" instead of "40Y7M5D").
    var ageM = text.match(/\b(\d{1,3}\s*Y[\s,]*\d{1,2}\s*M[A-Za-z\s,]{0,2}\d{1,2}\s*D)\b/i);
    // No leading \b: a "/" right before "Male"/"Female" is often misread as
    // a stray letter glued on with no word boundary (e.g. "IFemale").
    var genderM = text.match(/(Female|Male)\b/i);
    if (!ageM && !genderM) return null;
    return {
      age: ageM ? ageM[1].replace(/\s+/g, " ").trim() : "",
      gender: genderM ? genderM[1] : ""
    };
  }

  // Last-resort name match for a table row where the cell wrapped and cut
  // the name short in the OCR text (e.g. "MRS.PAVITHRA" with "PAULRAJ" lost
  // to a line break). Captures whatever title + capitalized word(s) are
  // actually there; the name field's fuzzyPrefix comparison means a
  // genuinely truncated value like this still matches the full name
  // elsewhere instead of raising a false mismatch.
  function findTitledName(text) {
    // Boundary after the name also accepts a quote/punctuation mark, since
    // OCR sometimes wraps a cell's text in stray quotes ("'MRS.PAVITHRA'").
    // The name word requires 2+ letters after its capital (not just a bare
    // star-of-zero) — otherwise "MRS?" can match "MR" and let the mandatory
    // [A-Z] absorb the real title's own "S", so "MRS." alone (title plus
    // the period right after it) falsely satisfies the whole pattern and
    // returns "MRS" as if that were a name. The separator after the title
    // accepts a hyphen as well as a period — the same small period glyph has
    // been seen OCR'd as either, depending on the binarization threshold.
    var m = text.match(/\b((?:MRS?|MS|DR)[.\-]?\s*[A-Z][A-Za-z]{2,}(?:\s+[A-Z][A-Za-z']{2,}){0,4})(?=['"‘’“”]?\s*(?:\d|\n|$|[.,;:)]))/);
    return m ? m[1].trim() : "";
  }

  function extractLisTableRow(text) {
    var out = {};
    var dateMatch = text.match(/(\d{1,2}[-\/][A-Za-z]{3,9}[-\/]\d{2,4}\s+\d{1,2}:\d{2}\s*[AP]M)([\s\S]{0,500})/i);
    if (!dateMatch) return out;

    out.collectionDate = dateMatch[1];
    var rest = dateMatch[2];

    // Name ends at whichever comes first: a 10-digit mobile (often blank —
    // don't require it), the start of the age/sex block, a wide gap between
    // table cells, or the end of the snippet.
    var idsName = rest.match(/(\d{7,12})\D{1,15}?(\d{9,13})\D{1,20}?([A-Za-z][A-Za-z.,'\s]{1,60}?)(?=\s*(?:\d{10}\b|\d{1,3}\s*Y\s*[\d,\s]*M|\s{2,}|$))/i);
    if (idsName) {
      out.sampleId = idsName[1];
      out.name = idsName[3].trim();
    }

    return out;
  }

  // No generic "N+ spaces means a new column" rule here on purpose: a PDF's
  // own text layer already comes back with each run's internal word-spacing
  // intact as literal single spaces (pdf.js groups a run like "Dr. Shwetha
  // Anand Baratikkae" into one string already), while the *inter-column* gap
  // — reconstructed from each run's x-position — is really just whatever
  // padding that PDF used to right-align its labels to a fixed colon column,
  // which varies wildly by label length (single digits up to 180+ in the
  // same document) with no size that reliably separates "new field" from
  // "padding before this field's own colon". A whitespace-count rule here
  // once truncated values like "23 Weeks / 1 Day" or "Peripheral Blood" at
  // the first incidental wide gap. The explicit label list below is what
  // actually catches a real "next field" boundary. The one gap shape that
  // *is* unambiguous: a wide gap landing right on a bare colon. That only
  // happens when the field whose colon it is has had its own label word
  // wrapped away onto an earlier reconstructed line (a two-column form
  // splitting e.g. "Sample receipt date" so "date" strands on its own line
  // below, leaving this line's next real token as just "... : 21.10.2026"
  // with no label text in front of it to anchor on).
  var STOP = "(?=\\n|$|\\s{3,}:|\\b(?:PIN|DOB|Age|Gender|Sex|Ethnicity|Hospital|Clinic|Contact|Sample|Referring|Specimen|Date|Collection|Received|Report|Biopsy\\s*(?:Date|Performed)|Gestational|UHID)\\b|(?:W|S|D|C)\\/O\\b)";

  function parseOcrText(text) {
    var t = (text || "").replace(/\r/g, "");
    var out = {};

    out.name = firstValidMatch(t, [
      new RegExp("(?:patient\\s*name|full\\s*name)\\s*[:\\-]?\\s*([^\\n]*?)" + STOP, "i")
    ], looksLikeRealName);
    out.age = firstMatch(t, [
      // \b before "age" matters: without it this also matches inside "Page"
      // (as in a "Page 1 of 6" footer), "Average", "Image", etc., since none
      // of those have a real word boundary before the "age" substring.
      /\bage\s*[:\-]?\s*([0-9]{1,3}\s*(?:years?|yrs?|y|months?|mon?s?|m|days?|d)\b)/i,
      /\bage\s*[:\-]?\s*([0-9]{1,3})\b/i,
      // Combined "Gender/ Age : Female / 35 Years" or "Date of Birth / Age :
      // 24/10/2000 / 28" fields print the age after a slash rather than
      // right after the word "age" itself, which the patterns above never
      // reach — anchor on whatever precedes that slash instead (a gender
      // word, or a DOB-shaped date).
      /(?:female|male)\s*\/\s*([0-9]{1,3}\s*(?:years?|yrs?|y)?)\b/i,
      /\d{1,2}\/\d{1,2}\/\d{2,4}\s*\/\s*([0-9]{1,3})\b/
    ]);
    out.gender = firstMatch(t, [
      /\b(?:gender|sex)\s*[:\-]?\s*(female|male|\bF\b|\bM\b)/i
    ]);
    out.uhid = firstValidMatch(t, [
      /\bPIN\s*[:\-]?\s*([A-Za-z0-9]+)/i,
      /\bUHID\s*[:\-]?\s*([A-Za-z0-9\-]+)/i
    ], isPlausibleId);
    out.doctor = firstValidMatch(t, [
      new RegExp("(?:referring\\s*clinician|referring\\s*doctor|clinical\\s*name|ref(?:erred)?\\s*by)\\s*[:\\-]?\\s*([^\\n]*?)" + STOP, "i")
    ], looksLikeRealName);
    out.hospital = firstValidMatch(t, [
      new RegExp("hospital\\s*\\/?\\s*clinic\\s*[:\\-]?\\s*([^\\n]*?)" + STOP, "i"),
      new RegExp("hospital\\s*[:\\-]?\\s*([^\\n]*?)" + STOP, "i")
    ], looksLikeRealName);
    out.sampleId = firstValidMatch(t, [
      /\b(?:sample\s*number|sample\s*no\.?|lab\s*no\.?|sin\s*no\.?)\s*[:\-]?\s*([A-Za-z0-9\-]+)/i
    ], isPlausibleId);
    out.collectionDate = firstMatch(t, [
      // "date" made optional: a two-column PDF layout can wrap a label like
      // "SAMPLE COLLECTION DATE" so "DATE" lands on the next visual line,
      // after the value has already been printed ("SAMPLE COLLECTION :
      // 31-08-2026\nPALAKKAD DATE") — requiring it adjacent missed the date.
      /(?:sample\s*collection(?:\s*date)?|collection(?:\s*date)?|entry\s*date\s*time?)\s*[:\-]?\s*([0-9]{1,2}[\/\-.][0-9]{1,2}[\/\-.][0-9]{2,4})/i,
      /(?:sample\s*collection(?:\s*date)?|collection(?:\s*date)?)\s*[:\-]?\s*([0-9]{1,2}[\s\-][A-Za-z]{3,9}[\s\-,]+[0-9]{2,4})/i
    ]);

    // Second pass: fill anything still empty from structural/positional
    // heuristics rather than a label match (helps table screenshots and
    // the printed parts of scanned forms).
    var row = extractLisTableRow(t);
    Object.keys(row).forEach(function (k) { if (!out[k]) out[k] = row[k]; });

    if (!out.age || !out.gender) {
      var ageSex = findAgeSex(t);
      if (ageSex) {
        if (!out.age) out.age = ageSex.age;
        if (!out.gender) out.gender = ageSex.gender;
      }
    }

    if (!out.uhid) out.uhid = findLabPin(t);
    if (!out.sampleId) out.sampleId = findFallbackNumericId(t);
    // These positional/structural fallbacks have no label to anchor on, so
    // gate each on looking like real text — otherwise a handwritten TRF's
    // illegible OCR noise (no clean label match to reject it) can slip
    // through as a confident-looking value.
    if (!out.doctor) {
      var dupPhrase = findDuplicatedPhrase(t);
      if (looksLikePlausibleText(dupPhrase)) out.doctor = dupPhrase;
    }
    if (!out.hospital) {
      var rateHospital = findRateTypeHospital(t);
      if (looksLikePlausibleText(rateHospital)) out.hospital = rateHospital;
    }
    if (!out.collectionDate) out.collectionDate = findPrintedTimestamp(t);
    if (!out.name) {
      var titledName = findTitledName(t);
      if (looksLikePlausibleText(titledName)) out.name = titledName;
    }

    // PGT-A-specific fields (only populated when the template includes them;
    // harmless no-ops otherwise since nothing reads these keys in that case).
    out.specimenType = firstValidMatch(t, [
      // Negative lookahead excludes "Specimen Type"/"Specimen Collection
      // Date"/"Specimen Receipt Date" — other headers on the same form that
      // start with the same word but aren't this field (a bare "Specimen :"
      // label is what this one actually looks like on the Report PDF).
      new RegExp("specimen(?!\\s*(?:type|collection|receipt)\\b)\\s*[:\\-]?\\s*([^\\n]*?)" + STOP, "i")
    ], looksLikeRealValue);
    // "date" made optional on both — same two-column wrap as collectionDate
    // above ("Sample receipt\ndate : 21.10.2026" with the value already on
    // the "receipt" line and only the bare word "date" pushed to the next).
    out.biopsyDate = firstMatch(t, [
      /biopsy(?:\s*date)?\s*[:\-]?\s*([0-9]{1,2}[\/\-.][0-9]{1,2}[\/\-.][0-9]{2,4})/i,
      /biopsy(?:\s*date)?\s*[:\-]?\s*([0-9]{1,2}[\s\-][A-Za-z]{3,9}[\s\-,]+[0-9]{2,4})/i
    ]);
    out.receiptDate = firstMatch(t, [
      /(?:sample\s*)?receipt(?:\s*date)?\s*[:\-]?\s*([0-9]{1,2}[\/\-.][0-9]{1,2}[\/\-.][0-9]{2,4})/i,
      /(?:sample\s*)?receipt(?:\s*date)?\s*[:\-]?\s*([0-9]{1,2}[\s\-][A-Za-z]{3,9}[\s\-,]+[0-9]{2,4})/i
    ]);
    out.biopsyBy = firstValidMatch(t, [
      // "by" made optional for the same two-column wrapping reason as
      // collectionDate above — "BIOPSY PERFORMED : <value>" with a lone
      // "BY" left stranded on the next line.
      new RegExp("biopsy\\s*performed(?:\\s*by)?\\s*[:\\-]?\\s*([^\\n]*?)" + STOP, "i")
    ], looksLikeRealName);
    out.partnerName = firstValidMatch(t, [
      new RegExp("\\b(?:W\\/O|S\\/O|D\\/O|C\\/O)\\s*[:\\-]?\\s*(?:MR\\.?|MRS\\.?|MS\\.?|DR\\.?)?\\s*([^\\n]*?)" + STOP, "i")
    ], looksLikeRealName);
    out.embryoIds = (function () {
      var ids = [];
      var re = /\bEMBRYO\s*[:\-]?\s*([A-Z]{1,4}\d{1,3})\b/gi;
      var m;
      while ((m = re.exec(t)) !== null) {
        var id = m[1].toUpperCase();
        if (ids.indexOf(id) === -1) ids.push(id);
      }
      if (ids.length === 0) {
        re = /\b[1-9]\d?\s+([A-Z]{1,3}\d{1,3})\b/g;
        while ((m = re.exec(t)) !== null) {
          var id2 = m[1].toUpperCase();
          if (ids.indexOf(id2) === -1) ids.push(id2);
        }
      }
      return ids.join(", ");
    })();

    // QF-PCR / prenatal-test fields
    out.gestationalAge = firstMatch(t, [
      new RegExp("gestational\\s*age\\s*[:\\-]?\\s*([^\\n]*?)" + STOP, "i")
    ]);
    out.pregnancyType = firstMatch(t, [
      new RegExp("pregnancy\\s*type\\s*[:\\-]?\\s*([^\\n]*?)" + STOP, "i")
    ]);

    // A label that sits on its own line (common on forms) can get swept into
    // the capture when the separator crosses the line break, so strip it
    // back off if it's still sitting at the front of the value.
    var LEADING_LABEL = /^(?:referring\s*clinician|referring\s*doctor|clinical\s*name|full\s*name|patient\s*name|ref(?:erred)?\s*by)\s*[:\-]?\s*/i;
    out.name = (out.name || "").replace(LEADING_LABEL, "");
    out.doctor = (out.doctor || "").replace(LEADING_LABEL, "");
    out.hospital = (out.hospital || "").replace(/^hospital\s*\/?\s*clinic\s*[:\-]?\s*/i, "");

    Object.keys(out).forEach(function (k) { out[k] = stripTrailingJunk(cleanLine(out[k])); });
    return out;
  }

  // Delegated on the wrapper (not the individual file inputs) so uploads
  // keep working after buildSourceCards() rebuilds the cards on a template
  // switch, without needing to re-attach a listener each time.
  sourcesWrap.addEventListener("change", function (e) {
    var fileInput = e.target;
    if (!fileInput || fileInput.type !== "file") return;
    var src = SOURCES.filter(function (s) { return fileInput.id === "file-" + s.key; })[0];
    if (!src) return;

    var file = fileInput.files && fileInput.files[0];
    if (!file) return;

    var statusEl = document.getElementById("status-" + src.key);
    var detailsEl = document.getElementById("details-" + src.key);
    var ocrTextEl = document.getElementById("ocrtext-" + src.key);

    statusEl.className = "upload-status is-busy";
    statusEl.innerHTML = '<span class="spinner"></span><span>Reading ' + escapeHtml(file.name) + '…</span>';
    detailsEl.hidden = true;

    ocrFile(file).then(function (text) {
      ocrTextEl.textContent = text.trim() || "(no text found)";
      detailsEl.hidden = false;

      var parsed = parseOcrText(text);
      var filledCount = 0;
      FIELDS.forEach(function (field) {
        var value = parsed[field.key] || getTemplateDefault(currentTemplateKey, src.key, field.key);
        if (value) {
          document.getElementById(field.key + "-" + src.key).value = value;
          filledCount++;
        }
      });

      statusEl.className = "upload-status";
      statusEl.innerHTML = "<span>Scanned " + escapeHtml(file.name) + " — filled " + filledCount + " of " + FIELDS.length + " field(s). Check against the text below.</span>";
      updateAll();
    }).catch(function (err) {
      statusEl.className = "upload-status is-error";
      statusEl.textContent = "Could not read this file: " + (err && err.message ? err.message : err);
    });
  });

  // Per-template, per-source default values, used only when that source's
  // own extraction comes up empty — e.g. a PGT-A report never states
  // gender because the patient is always female, so there's nothing to
  // compare against Freedom/TRF's actual gender without this. Other
  // templates have no defaults: every source always uses whatever its own
  // document says.
  var TEMPLATE_DEFAULTS = {
    pgta: { report: { gender: "Female" } },
    // QF-PCR (amniotic fluid aneuploidy screening) is also always a
    // pregnant patient, so the same reasoning applies here.
    qfpcr: { report: { gender: "Female" } },
    // YCMD (Y-chromosome microdeletion) only applies to male patients, and
    // the report never states gender either.
    ycmd: { report: { gender: "Male" } },
    // NIPT (non-invasive prenatal screening) is likewise always run on a
    // pregnant patient, and the report has no gender field at all.
    nipt: { report: { gender: "Female" } }
  };
  function getTemplateDefault(templateKey, srcKey, fieldKey) {
    var t = TEMPLATE_DEFAULTS[templateKey];
    var s = t && t[srcKey];
    return (s && s[fieldKey]) || "";
  }

  var currentTemplateKey = "common";
  var templateSelect = document.getElementById("templateSelect");
  var templateHint = document.getElementById("templateHint");
  function applyTemplate(key) {
    currentTemplateKey = key;
    FIELDS = COMMON_FIELDS.concat(TEMPLATE_EXTRA_FIELDS[key] || []);
    templateHint.textContent = TEMPLATE_HINTS[key] || "";
    buildSourceCards();
    SOURCES.forEach(function (src) {
      FIELDS.forEach(function (field) {
        var def = getTemplateDefault(key, src.key, field.key);
        if (!def) return;
        var el = document.getElementById(field.key + "-" + src.key);
        if (el && !el.value) el.value = def;
      });
    });
    updateAll();
  }
  templateSelect.addEventListener("change", function () {
    applyTemplate(templateSelect.value);
  });
  applyTemplate(templateSelect.value);
})();
</script>
</body>
</html>
